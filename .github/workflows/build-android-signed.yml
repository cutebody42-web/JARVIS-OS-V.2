name: Build signed JARVIS Android release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "scripts/configure_android_signing.py"
      - "tests/test_android_signing.py"
      - ".github/workflows/build-android-signed.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager is unavailable on the runner" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "No Android NDK is available on the runner" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Initialize generated Android project
        working-directory: web
        env:
          CI: "true"
        run: npx --yes @tauri-apps/cli@2.12.0 android init

      - name: Pin generated Android SDK to tested platform
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/gen/android -type f \( -name "*.gradle.kts" -o -name "*.gradle" \) -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/compileSdk([[:space:]]*=[[:space:]]*)[0-9]+/compileSdk\1 36/g' "$file"
            sed -i -E 's/targetSdk([[:space:]]*=[[:space:]]*)[0-9]+/targetSdk\1 36/g' "$file"
          done

      - name: Prepare isolated signing key and Gradle config
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/jarvis-android-release.jks"
          PROPERTIES="$GITHUB_WORKSPACE/web/src-tauri/gen/android/keystore.properties"
          GRADLE="$GITHUB_WORKSPACE/web/src-tauri/gen/android/app/build.gradle.kts"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            KEY_ALIAS="jarvis-ci-contract"
            KEY_PASSWORD="jarvis-ci-contract-password"
            STORE_PASSWORD="jarvis-ci-contract-password"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=JARVIS CI Signing Contract, OU=CI, O=JARVIS, C=US"
            SIGNING_KIND="ephemeral-ci-contract"
          else
            for name in ANDROID_KEY_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD ANDROID_CERT_SHA256; do
              if [ -z "${!name:-}" ]; then
                echo "Required production signing secret $name is missing" >&2
                exit 1
              fi
            done
            printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$KEYSTORE"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            SIGNING_KIND="production-keystore"
          fi

          test -s "$KEYSTORE"
          export KEYSTORE PROPERTIES KEY_ALIAS KEY_PASSWORD STORE_PASSWORD
          python - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              return (value.replace("\\", "\\\\")
                           .replace("\r", "\\r")
                           .replace("\n", "\\n"))

          values = {
              "keyAlias": os.environ["KEY_ALIAS"],
              "keyPassword": os.environ["KEY_PASSWORD"],
              "storeFile": os.environ["KEYSTORE"],
              "storePassword": os.environ["STORE_PASSWORD"],
          }
          Path(os.environ["PROPERTIES"]).write_text(
              "".join(f"{key}={escape(value)}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY

          python scripts/configure_android_signing.py "$GRADLE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "JARVIS_SIGNING_KIND=$SIGNING_KIND" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: web
        env:
          CI: "true"
        run: npx --yes @tauri-apps/cli@2.12.0 android build --apk --target aarch64

      - name: Verify APK signature and certificate identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-signed
          APK="$(find web/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -iname '*debug*' | head -n 1)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Signed release APK was not produced" >&2
            exit 1
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT_SHA="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ -z "$CERT_SHA" ]; then
            echo "Could not extract signer certificate SHA-256" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            if [ "$CERT_SHA" != "$EXPECTED" ]; then
              echo "APK signer certificate does not match ANDROID_CERT_SHA256" >&2
              exit 1
            fi
          fi

          cp "$APK" artifacts/android-signed/JARVIS-Companion-release.apk
          sha256sum artifacts/android-signed/JARVIS-Companion-release.apk | awk '{print "sha256="$1}' > artifacts/android-signed/build-info.txt
          {
            echo "commit=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "shell=tauri-mobile"
            echo "architecture=aarch64"
            echo "build_type=release"
            echo "signature_verified=true"
            echo "signing_kind=$JARVIS_SIGNING_KIND"
            echo "certificate_sha256=$CERT_SHA"
          } >> artifacts/android-signed/build-info.txt

      - name: Upload production signed Android release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Signed-Release
          path: |
            artifacts/android-signed/JARVIS-Companion-release.apk
            artifacts/android-signed/build-info.txt
          if-no-files-found: error
          retention-days: 14
