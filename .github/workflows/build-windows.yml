name: Build JARVIS Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "brain_sidecar.py"
      - "api/jarvis_local_server.py"
      - "core/**"
      - "agent/**"
      - "actions/**"
      - "memory/**"
      - "models/**"
      - "requirements.txt"
      - "packaging/windows/JARVIS-Brain.spec"
      - "web/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: ["product/**"]
    paths:
      - "brain_sidecar.py"
      - "api/jarvis_local_server.py"
      - "core/**"
      - "agent/**"
      - "actions/**"
      - "memory/**"
      - "models/**"
      - "requirements.txt"
      - "packaging/windows/JARVIS-Brain.spec"
      - "web/**"
      - ".github/workflows/build-windows.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build embedded JARVIS Brain sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"
          pyinstaller --clean --noconfirm packaging/windows/JARVIS-Brain.spec
          if (!(Test-Path "dist/jarvis-brain.exe")) {
            throw "Headless JARVIS Brain sidecar was not produced"
          }
          New-Item -ItemType Directory -Force "web/src-tauri/binaries" | Out-Null
          Copy-Item "dist/jarvis-brain.exe" "web/src-tauri/binaries/jarvis-brain-x86_64-pc-windows-msvc.exe" -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Prepare deterministic libsodium dependency
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) {
            $vcpkgExe = (Get-Command vcpkg).Source
            $vcpkgRoot = Split-Path $vcpkgExe -Parent
          }
          if (-not (Test-Path $vcpkgRoot)) { throw "VCPKG root could not be resolved" }
          vcpkg install libsodium:x64-windows
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SODIUM_USE_PKG_CONFIG=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate branded platform icons
        working-directory: web
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2.12.0 icon src-tauri/jarvis-icon.svg

      - name: Build one-click Tauri NSIS installer
        working-directory: web
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2.12.0 build --bundles nsis

      - name: Collect installer and provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          $installer = Get-ChildItem "web/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Tauri NSIS installer was not produced"
          }
          Copy-Item $installer.FullName "artifacts/windows/JARVIS-Setup.exe" -Force
          $hash = (Get-FileHash "artifacts/windows/JARVIS-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "commit=${{ github.sha }}" | Out-File artifacts/windows/build-info.txt -Encoding utf8
          "sha256=$hash" | Out-File artifacts/windows/build-info.txt -Encoding utf8 -Append
          "desktop_shell=tauri" | Out-File artifacts/windows/build-info.txt -Encoding utf8 -Append
          "brain_sidecar=embedded_pyinstaller" | Out-File artifacts/windows/build-info.txt -Encoding utf8 -Append
          "python_required_by_user=false" | Out-File artifacts/windows/build-info.txt -Encoding utf8 -Append
          "hardware_certified=false" | Out-File artifacts/windows/build-info.txt -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: |
            artifacts/windows/JARVIS-Setup.exe
            artifacts/windows/build-info.txt
          if-no-files-found: error
