name: NEXUS architecture contracts

on:
  pull_request:
  push:
    branches: ["nexus/**", "product/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai cryptography fastapi httpx
      - run: python -m unittest -v tests.test_nexus_contracts tests.test_nexus_text_route tests.test_owner_kernel tests.test_local_provider tests.test_missions tests.test_hardware_profile tests.test_model_runtime tests.test_model_router tests.test_personas tests.test_nexus_event_store tests.test_nexus_merge tests.test_nexus_merge_applier tests.test_nexus_sync_daemon tests.test_nexus_peer_auth tests.test_nexus_sync_node tests.test_nexus_pairing tests.test_windows_broker tests.test_jarvis_brain tests.test_ollama_bootstrap tests.test_jarvis_memory tests.test_self_heal tests.test_update_manager tests.test_github_repair tests.test_local_brain_self_heal tests.test_worker_pool tests.test_jarvis_council tests.test_owner_face tests.test_owner_approval tests.test_owner_approval_http tests.test_mobile_approval_bridge
      - uses: actions/checkout@v4
        with:
          ref: fffb487cc79adb827d21918ade107bebcdc2c03c
          path: .baseline-phase2
      - run: python scripts/benchmark_missions.py --baseline-dir .baseline-phase2 --output artifacts/mission-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: mission-benchmark
          path: artifacts/mission-benchmark.json
