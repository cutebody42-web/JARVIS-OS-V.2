name: NEXUS architecture contracts

on:
  pull_request:
  push:
    branches: ["nexus/**"]

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-genai
      - run: python -m unittest -v tests.test_nexus_contracts tests.test_nexus_text_route tests.test_ollama_provider tests.test_hardware_profile tests.test_model_runtime tests.test_model_router tests.test_personas
