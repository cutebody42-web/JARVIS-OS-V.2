name: JARVIS cloud device E2E

on:
  workflow_dispatch:
  push:
    branches: ["product/**"]
    paths:
      - "web/**"
      - "brain_sidecar.py"
      - "api/jarvis_local_server.py"
      - "core/**"
      - "agent/**"
      - "actions/**"
      - "memory/**"
      - "models/**"
      - "requirements.txt"
      - "packaging/windows/**"
      - ".github/workflows/cloud-device-e2e.yml"
  pull_request:
    paths:
      - "web/**"
      - "brain_sidecar.py"
      - "api/jarvis_local_server.py"
      - "core/**"
      - "agent/**"
      - "actions/**"
      - "memory/**"
      - "models/**"
      - "requirements.txt"
      - "packaging/windows/**"
      - ".github/workflows/cloud-device-e2e.yml"

permissions:
  contents: read

jobs:
  windows-installed-app:
    name: Windows VM install + launch
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build embedded JARVIS Brain sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"
          pyinstaller --clean --noconfirm packaging/windows/JARVIS-Brain.spec
          if (!(Test-Path "dist/jarvis-brain.exe")) {
            throw "Embedded JARVIS Brain sidecar was not produced"
          }
          New-Item -ItemType Directory -Force "web/src-tauri/binaries" | Out-Null
          Copy-Item "dist/jarvis-brain.exe" "web/src-tauri/binaries/jarvis-brain-x86_64-pc-windows-msvc.exe" -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install product-shell dependencies
        working-directory: web
        run: npm ci

      - name: Prepare Rust and libsodium
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          vcpkg install libsodium:x64-windows
          "SODIUM_USE_PKG_CONFIG=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate icons and build NSIS installer
        working-directory: web
        shell: pwsh
        run: |
          npm run tauri -- icon src-tauri/jarvis-icon.svg
          npm run tauri -- build --bundles nsis

      - name: Install JARVIS on the cloud Windows VM
        shell: pwsh
        run: |
          $installer = Get-ChildItem "web/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer missing" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 4

          $candidates = @(
            (Join-Path $env:LOCALAPPDATA "Programs\JARVIS\JARVIS.exe"),
            (Join-Path $env:LOCALAPPDATA "JARVIS\JARVIS.exe")
          )
          $appExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appExe) {
            $appExe = Get-ChildItem $env:LOCALAPPDATA -Filter "JARVIS.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $appExe) { throw "Installed JARVIS.exe was not found" }

          "JARVIS_APP_EXE=$appExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installed app: $appExe"

      - name: Launch installed desktop app and embedded Brain
        shell: pwsh
        run: |
          $app = Start-Process -FilePath $env:JARVIS_APP_EXE -PassThru
          Start-Sleep -Seconds 20

          $jarvis = Get-Process -Name "JARVIS" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $jarvis) { throw "Installed JARVIS desktop process exited during real launch" }

          $brain = Get-Process -Name "jarvis-brain" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $brain) { throw "Embedded jarvis-brain sidecar did not start from the installed desktop app" }

          $listen = Get-NetTCPConnection -OwningProcess $brain.Id -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalAddress -in @("127.0.0.1", "::1") } |
            Select-Object -First 1
          if ($null -eq $listen) { throw "jarvis-brain did not expose a loopback listening socket" }

          $health = Invoke-RestMethod -Uri ("http://127.0.0.1:{0}/v1/health" -f $listen.LocalPort) -TimeoutSec 10
          if (-not $health.ok -or $health.identity -ne "JARVIS") {
            throw "Installed Brain health probe did not identify JARVIS"
          }

          New-Item -ItemType Directory -Force artifacts\windows-e2e | Out-Null
          @(
            "desktop_pid=$($jarvis.Id)",
            "brain_pid=$($brain.Id)",
            "brain_port=$($listen.LocalPort)",
            "identity=$($health.identity)",
            "health_ok=$($health.ok)",
            "commit=$env:GITHUB_SHA"
          ) | Set-Content artifacts\windows-e2e\runtime.txt

      - name: Capture Windows desktop screenshot
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts\windows-e2e | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save((Join-Path $PWD "artifacts\windows-e2e\desktop.png"))
          $graphics.Dispose()
          $bmp.Dispose()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-Windows-Cloud-E2E
          path: artifacts/windows-e2e
          if-no-files-found: warn

  android-emulator:
    name: Android emulator install + launch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve Android NDK and Rust target
        shell: bash
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -d "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          rustup update stable
          rustup default stable
          rustup target add x86_64-linux-android

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Initialize Android project
        working-directory: web
        env:
          CI: "true"
        run: npm run tauri -- android init

      - name: Pin Android SDK for emulator build
        working-directory: web
        shell: bash
        run: |
          find src-tauri/gen/android -type f \( -name "*.gradle.kts" -o -name "*.gradle" \) -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/compileSdk([[:space:]]*=[[:space:]]*)[0-9]+/compileSdk\1 35/g' "$file"
            sed -i -E 's/targetSdk([[:space:]]*=[[:space:]]*)[0-9]+/targetSdk\1 35/g' "$file"
          done

      - name: Build x86_64 APK for emulator
        working-directory: web
        env:
          CI: "true"
        run: npm run tauri -- android build --debug --apk --target x86_64

      - name: Locate emulator APK
        shell: bash
        run: |
          APK="$(find web/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -f "$APK"
          echo "JARVIS_APK=$APK" >> "$GITHUB_ENV"
          echo "APK=$APK"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot Android emulator and exercise JARVIS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            set -euxo pipefail
            mkdir -p artifacts/android-e2e
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m1 '1'
            adb install -r "$JARVIS_APK"
            adb shell pm list packages | grep 'package:ai.jarvis.app'

            adb shell monkey -p ai.jarvis.app -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof ai.jarvis.app | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -E 'ai\.jarvis\.app|mResumedActivity' > artifacts/android-e2e/activity-before.txt

            OFFER='{"inviter_device":"cloud-desktop","expires_at":"2099-01-01T00:00:00Z"}'
            ENCODED="$(printf '%s' "$OFFER" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
            adb shell am start -W -a android.intent.action.VIEW -d "jarvis://pair?offer=$ENCODED"
            sleep 5
            PID2="$(adb shell pidof ai.jarvis.app | tr -d '\r')"
            test -n "$PID2"
            adb shell dumpsys activity activities | grep -E 'ai\.jarvis\.app|mResumedActivity' > artifacts/android-e2e/activity-after.txt

            adb exec-out screencap -p > artifacts/android-e2e/jarvis-mobile.png
            adb logcat -d -t 800 > artifacts/android-e2e/logcat.txt

            {
              echo "package=ai.jarvis.app"
              echo "pid=$PID2"
              echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')"
              echo "commit=$GITHUB_SHA"
              echo "deep_link=jarvis://pair"
            } > artifacts/android-e2e/runtime.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-Android-Emulator-E2E
          path: artifacts/android-e2e
          if-no-files-found: warn
