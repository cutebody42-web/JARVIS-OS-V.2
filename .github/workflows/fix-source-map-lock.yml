name: Temporary source-map-js lock repair

on:
  push:
    branches:
      - fix/source-map-js-1.2.2

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-map-js-1.2.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Refresh only the vulnerable transitive lock entry
        working-directory: web
        run: npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package manifest stayed unchanged
        run: git diff --exit-code -- web/package.json
      - name: Verify patched source-map-js is locked
        run: node -e "const l=require('./web/package-lock.json'); const p=l.packages['node_modules/source-map-js']; if(!p || p.version !== '1.2.2') { console.error(p); process.exit(1); } console.log('source-map-js', p.version);"
      - name: Install exact lock and enforce high-severity audit gate
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix vulnerable source-map-js lock entry"
          git push origin HEAD:fix/source-map-js-1.2.2
