name: JARVIS product shell

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/product-shell.yml"
  push:
    branches: ["product/**"]
    paths:
      - "web/**"
      - ".github/workflows/product-shell.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Reject high or critical npm vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -d out/_next

  tauri-desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Verify Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version
      - name: Check JARVIS Tauri shell
        run: cargo check --manifest-path web/src-tauri/Cargo.toml
