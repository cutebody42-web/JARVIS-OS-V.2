name: One-shot wake-word render state fix

on:
  push:
    branches: ["enhance/wakeword-product-loop-v2"]
    paths:
      - ".github/workflows/fix-wakeword-render-state.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enhance/wakeword-product-loop-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact render-state fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("web/src/components/wake-word-bridge.tsx")
          text = path.read_text("utf-8")
          old = "  const enabled = Boolean(status?.enabled && enabledRef.current);"
          new = "  const enabled = Boolean(status?.enabled);"
          if text.count(old) != 1:
              raise SystemExit("expected wake-word render-state anchor exactly once")
          path.write_text(text.replace(old, new, 1), "utf-8")
          PY
          cd web
          npm ci
          npm run typecheck
          npm run lint
      - name: Commit only the lint fix
        shell: bash
        run: |
          set -euo pipefail
          git add web/src/components/wake-word-bridge.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix wake-word render state lint contract"
          git push origin HEAD:enhance/wakeword-product-loop-v2
