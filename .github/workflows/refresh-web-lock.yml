name: Refresh secure web lockfile

on:
  push:
    branches: ["product/**"]
    paths:
      - ".github/workflows/refresh-web-lock.yml"

concurrency:
  group: secure-web-lock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Resolve current patched dependency graph
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit refreshed lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/package.json web/package-lock.json; then
            echo "Web dependency lock is already current and audit-clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git commit -m "Refresh patched web dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
