[package]
name = "tauri-plugin-jarvis-fingerprint"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-jarvis-fingerprint"
description = "Fingerprint-only owner authentication for the JARVIS Android and iOS companions"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
