[package]
name = "jarvis-shell"
version = "2.0.0"
description = "JARVIS shared desktop and mobile shell"
authors = ["JARVIS"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "jarvis_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-notification = "2.5.0"
tauri-plugin-websocket = "2.5.0"
tauri-plugin-deep-link = "2"
tauri-plugin-stronghold = "2.4.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"
tauri-plugin-jarvis-fingerprint = { path = "plugins/tauri-plugin-jarvis-fingerprint" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.4.0"
tauri-plugin-barcode-scanner = "2.5.0"
tauri-plugin-haptics = "2.4.0"
