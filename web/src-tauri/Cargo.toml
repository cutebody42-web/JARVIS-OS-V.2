[package]
name = "jarvis-shell"
version = "2.0.0"
description = "JARVIS shared desktop and mobile shell"
authors = ["JARVIS"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "jarvis_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-notification = "2.5.0"
tauri-plugin-websocket = "2.5.0"
tauri-plugin-deep-link = "2"
tauri-plugin-stronghold = "2.4.0"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.4.0"
tauri-plugin-barcode-scanner = "2.5.0"
tauri-plugin-haptics = "2.4.0"
