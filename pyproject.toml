[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-mark-xxxix"
version = "0.1.0"
description = "JARVIS local-first NEXUS personal AI runtime"
requires-python = ">=3.11"

[project.optional-dependencies]
local-voice = ["faster-whisper>=1,<2"]
mcp = ["mcp>=2,<3"]
windows-uia = ["pywinauto>=0.6.8,<0.7"]
extended = ["faster-whisper>=1,<2", "mcp>=2,<3", "pywinauto>=0.6.8,<0.7"]

[project.scripts]
jarvis = "main:cli_main"

[tool.setuptools]
py-modules = ["main", "ui"]

[tool.setuptools.packages.find]
include = ["actions*", "agent*", "api*", "awareness*", "config*", "core*", "memory*"]
